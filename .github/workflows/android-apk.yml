name: Android APK CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check signing secrets availability
        id: signing
        run: |
          if [ -n "${{ secrets.NEARNOTE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.NEARNOTE_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.NEARNOTE_KEY_ALIAS }}" ] && [ -n "${{ secrets.NEARNOTE_KEY_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release keystore from secrets
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: |
          echo "${{ secrets.NEARNOTE_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/nearnote-release.jks
          echo "NEARNOTE_KEYSTORE_PATH=$RUNNER_TEMP/nearnote-release.jks" >> $GITHUB_ENV
          echo "NEARNOTE_KEYSTORE_PASSWORD=${{ secrets.NEARNOTE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "NEARNOTE_KEY_ALIAS=${{ secrets.NEARNOTE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "NEARNOTE_KEY_PASSWORD=${{ secrets.NEARNOTE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare debug APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/nearnote-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk dist/nearnote-release.apk; fi
          ls -lah dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nearnote-debug-apk
          path: dist/nearnote-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ hashFiles('dist/nearnote-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nearnote-release-apk
          path: dist/nearnote-release.apk
          if-no-files-found: error
